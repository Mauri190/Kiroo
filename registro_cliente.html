<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiroo - Registro de Cliente</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --kiroo-red: #d32f2f;
            --bg-dark: #0a0a0a;
            --bg-card: #1a1a1a;
            --text-light: #ffffff;
            --text-muted: #b0b0b0;
            --client-blue: #2196f3;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .register-container {
            width: 100%;
            max-width: 550px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--kiroo-red);
            text-decoration: none;
            font-weight: 500;
            margin-bottom: 1.5rem;
            transition: opacity 0.2s;
        }

        .back-link:hover { opacity: 0.8; color: var(--kiroo-red); }

        .register-card {
            background: var(--bg-card);
            border-radius: 30px;
            padding: 3rem 2.5rem;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .register-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .register-header .icon {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(33, 150, 243, 0.15);
            color: var(--client-blue);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            margin: 0 auto 1rem;
        }

        .register-header h2 {
            font-weight: 700;
            margin-bottom: 0.3rem;
        }

        .register-header p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .register-header .badge-client {
            background: rgba(33, 150, 243, 0.2);
            color: #64b5f6;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.75rem;
            display: inline-block;
            margin-top: 8px;
        }

        .form-label {
            color: #ccc;
            font-weight: 500;
            font-size: 0.85rem;
            margin-bottom: 6px;
        }

        .form-control {
            background: #2a2a2a;
            border: 1px solid #3a3a3a;
            color: #fff;
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 0.95rem;
            transition: all 0.2s;
        }

        .form-control:focus {
            background: #333;
            border-color: var(--client-blue);
            box-shadow: 0 0 0 0.2rem rgba(33, 150, 243, 0.15);
            color: #fff;
        }

        .form-control::placeholder { color: #666; }

        .btn-register {
            background: linear-gradient(135deg, #2196f3, #1976d2);
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 14px;
            font-weight: 600;
            font-size: 1.05rem;
            width: 100%;
            margin-top: 1.5rem;
            transition: all 0.3s;
        }

        .btn-register:hover {
            background: linear-gradient(135deg, #1976d2, #1565c0);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(33, 150, 243, 0.3);
        }

        .login-link {
            text-align: center;
            margin-top: 1.5rem;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .login-link a {
            color: var(--client-blue);
            font-weight: 600;
            text-decoration: none;
        }

        .login-link a:hover { text-decoration: underline; }

        .info-box {
            background: rgba(33, 150, 243, 0.08);
            border: 1px dashed rgba(33, 150, 243, 0.3);
            border-radius: 15px;
            padding: 1rem;
            margin-top: 1rem;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <div class="register-container">
        <a href="login.html" class="back-link">
            <i class="fa-solid fa-arrow-left"></i> Volver al login
        </a>

        <div class="register-card">
            <div class="register-header">
                <div class="icon">
                    <i class="fa-solid fa-user-plus"></i>
                </div>
                <h2>Registro de Cliente</h2>
                <p>Crea tu cuenta para gestionar tus vehículos</p>
                <span class="badge-client">
                    <i class="fa-solid fa-car me-1"></i>Cuenta Cliente
                </span>
            </div>

            <form id="clientRegisterForm">
                <div class="mb-3">
                    <label class="form-label">Nombre completo *</label>
                    <input type="text" class="form-control" id="fullName" placeholder="Tu nombre completo" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Correo electrónico *</label>
                    <input type="email" class="form-control" id="email" placeholder="correo@ejemplo.com" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Teléfono *</label>
                    <input type="tel" class="form-control" id="phone" placeholder="+503 1234 5678" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Vehículo principal (marca/modelo/placa)</label>
                    <input type="text" class="form-control" id="vehicleInfo" placeholder="Ej: Toyota Corolla P-1234">
                </div>

                <div class="mb-3">
                    <label class="form-label">Contraseña *</label>
                    <input type="password" class="form-control" id="password" placeholder="Mínimo 6 caracteres" minlength="6" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Confirmar contraseña *</label>
                    <input type="password" class="form-control" id="confirmPassword" placeholder="Repite tu contraseña" minlength="6" required>
                </div>

                <div class="info-box">
                    <i class="fa-solid fa-circle-info me-2"></i>
                    Podrás agregar más vehículos y gestionar tu agenda desde tu panel de cliente
                </div>

                <button type="submit" class="btn-register">
                    <i class="fa-solid fa-user-plus me-2"></i> Crear cuenta de Cliente
                </button>
            </form>

            <div class="login-link">
                ¿Ya tienes cuenta? <a href="login_cliente.html">Inicia sesión aquí</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('clientRegisterForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const vehicleInfo = document.getElementById('vehicleInfo').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (!fullName || !email || !phone || !password) {
                alert('Por favor completa todos los campos obligatorios.');
                return;
            }

            if (password !== confirmPassword) {
                alert('Las contraseñas no coinciden.');
                return;
            }

            if (password.length < 6) {
                alert('La contraseña debe tener al menos 6 caracteres.');
                return;
            }

            // Verificar si el correo ya existe
            const users = JSON.parse(localStorage.getItem('kiroo_users') || '[]');
            if (users.some(u => u.email === email)) {
                alert('Este correo electrónico ya está registrado. Usa otro o inicia sesión.');
                return;
            }

            const clientData = {
                id: 'client_' + Date.now(),
                type: 'cliente',
                fullName: fullName,
                email: email,
                phone: phone,
                vehicleInfo: vehicleInfo,
                password: password,
                createdAt: new Date().toISOString(),
                level: 1,
                points: 0
            };

            users.push(clientData);
            localStorage.setItem('kiroo_users', JSON.stringify(users));

            localStorage.setItem('kiroo_currentUser', JSON.stringify({
                id: clientData.id,
                type: 'cliente',
                fullName: clientData.fullName,
                email: clientData.email
            }));

            alert('✅ ¡Registro exitoso! Bienvenido a Kiroo, ' + fullName);
            window.location.href = 'dashboard_cliente.html';
        });
    </script>
</body>
</html>
