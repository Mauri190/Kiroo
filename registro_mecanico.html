<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiroo - Registro de Mecánico</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --kiroo-red: #d32f2f;
            --bg-dark: #0a0a0a;
            --bg-card: #1a1a1a;
            --text-light: #ffffff;
            --text-muted: #b0b0b0;
            --mech-orange: #ff9800;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .register-container {
            width: 100%;
            max-width: 550px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--kiroo-red);
            text-decoration: none;
            font-weight: 500;
            margin-bottom: 1.5rem;
            transition: opacity 0.2s;
        }

        .back-link:hover { opacity: 0.8; color: var(--kiroo-red); }

        .register-card {
            background: var(--bg-card);
            border-radius: 30px;
            padding: 3rem 2.5rem;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .register-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .register-header .icon {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(255, 152, 0, 0.15);
            color: var(--mech-orange);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            margin: 0 auto 1rem;
        }

        .register-header h2 {
            font-weight: 700;
            margin-bottom: 0.3rem;
        }

        .register-header p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .register-header .badge-mechanic {
            background: rgba(255, 152, 0, 0.2);
            color: #ffb74d;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.75rem;
            display: inline-block;
            margin-top: 8px;
        }

        .form-label {
            color: #ccc;
            font-weight: 500;
            font-size: 0.85rem;
            margin-bottom: 6px;
        }

        .form-control, .form-select {
            background: #2a2a2a;
            border: 1px solid #3a3a3a;
            color: #fff;
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 0.95rem;
            transition: all 0.2s;
        }

        .form-control:focus, .form-select:focus {
            background: #333;
            border-color: var(--mech-orange);
            box-shadow: 0 0 0 0.2rem rgba(255, 152, 0, 0.15);
            color: #fff;
        }

        .form-control::placeholder { color: #666; }
        .form-select option { background: #2a2a2a; color: #fff; }

        textarea.form-control {
            resize: vertical;
            min-height: 80px;
        }

        .btn-register {
            background: linear-gradient(135deg, #ff9800, #f57c00);
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 14px;
            font-weight: 600;
            font-size: 1.05rem;
            width: 100%;
            margin-top: 1.5rem;
            transition: all 0.3s;
        }

        .btn-register:hover {
            background: linear-gradient(135deg, #f57c00, #ef6c00);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(255, 152, 0, 0.3);
        }

        .login-link {
            text-align: center;
            margin-top: 1.5rem;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .login-link a {
            color: var(--mech-orange);
            font-weight: 600;
            text-decoration: none;
        }

        .login-link a:hover { text-decoration: underline; }

        .info-box {
            background: rgba(255, 152, 0, 0.08);
            border: 1px dashed rgba(255, 152, 0, 0.3);
            border-radius: 15px;
            padding: 1rem;
            margin-top: 1rem;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <div class="register-container">
        <a href="login.html" class="back-link">
            <i class="fa-solid fa-arrow-left"></i> Volver al login
        </a>

        <div class="register-card">
            <div class="register-header">
                <div class="icon">
                    <i class="fa-solid fa-wrench"></i>
                </div>
                <h2>Registro de Mecánico</h2>
                <p>Crea tu cuenta para atender clientes</p>
                <span class="badge-mechanic">
                    <i class="fa-solid fa-gear me-1"></i>Cuenta Mecánico
                </span>
            </div>

            <form id="mechanicRegisterForm">
                <div class="mb-3">
                    <label class="form-label">Nombre completo *</label>
                    <input type="text" class="form-control" id="fullName" placeholder="Tu nombre completo" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Correo electrónico *</label>
                    <input type="email" class="form-control" id="email" placeholder="correo@ejemplo.com" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Teléfono *</label>
                    <input type="tel" class="form-control" id="phone" placeholder="+503 1234 5678" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Especialidad *</label>
                    <select class="form-select" id="specialty" required>
                        <option value="" disabled selected>Selecciona tu especialidad</option>
                        <option value="general">🔧 Mecánica General</option>
                        <option value="frenos">🛑 Sistema de Frenos</option>
                        <option value="electrico">⚡ Sistema Eléctrico</option>
                        <option value="motor">⚙️ Motor y Transmisión</option>
                        <option value="suspension">🔩 Suspensión y Dirección</option>
                        <option value="carroceria">🚗 Carrocería y Pintura</option>
                        <option value="otro">📌 Otra especialidad</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Nombre del taller (opcional)</label>
                    <input type="text" class="form-control" id="workshopName" placeholder="Nombre de tu taller">
                </div>

                <div class="mb-3">
                    <label class="form-label">Años de experiencia</label>
                    <input type="number" class="form-control" id="experience" placeholder="Ej: 5" min="0" max="50">
                </div>

                <div class="mb-3">
                    <label class="form-label">Contraseña *</label>
                    <input type="password" class="form-control" id="password" placeholder="Mínimo 6 caracteres" minlength="6" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Confirmar contraseña *</label>
                    <input type="password" class="form-control" id="confirmPassword" placeholder="Repite tu contraseña" minlength="6" required>
                </div>

                <div class="info-box">
                    <i class="fa-solid fa-circle-info me-2"></i>
                    Tu perfil será visible para los clientes que busquen mecánicos de confianza
                </div>

                <button type="submit" class="btn-register">
                    <i class="fa-solid fa-user-plus me-2"></i> Crear cuenta de Mecánico
                </button>
            </form>

            <div class="login-link">
                ¿Ya tienes cuenta? <a href="login_mecanico.html">Inicia sesión aquí</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('mechanicRegisterForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const specialty = document.getElementById('specialty').value;
            const workshopName = document.getElementById('workshopName').value.trim();
            const experience = document.getElementById('experience').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (!fullName || !email || !phone || !specialty || !password) {
                alert('Por favor completa todos los campos obligatorios.');
                return;
            }

            if (password !== confirmPassword) {
                alert('Las contraseñas no coinciden.');
                return;
            }

            if (password.length < 6) {
                alert('La contraseña debe tener al menos 6 caracteres.');
                return;
            }

            // Verificar si el correo ya existe
            const users = JSON.parse(localStorage.getItem('kiroo_users') || '[]');
            if (users.some(u => u.email === email)) {
                alert('Este correo electrónico ya está registrado. Usa otro o inicia sesión.');
                return;
            }

            const mechanicData = {
                id: 'mech_' + Date.now(),
                type: 'mecanico',
                fullName: fullName,
                email: email,
                phone: phone,
                specialty: specialty,
                workshopName: workshopName,
                experience: experience || 0,
                password: password,
                createdAt: new Date().toISOString(),
                rating: 0,
                totalDiagnostics: 0
            };

            users.push(mechanicData);
            localStorage.setItem('kiroo_users', JSON.stringify(users));

            localStorage.setItem('kiroo_currentUser', JSON.stringify({
                id: mechanicData.id,
                type: 'mecanico',
                fullName: mechanicData.fullName,
                email: mechanicData.email
            }));

            alert('✅ ¡Registro exitoso! Bienvenido a Kiroo, ' + fullName);
            window.location.href = 'dashboard_mecanico.html';
        });
    </script>
</body>
</html>
