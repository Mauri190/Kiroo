<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiroo - Iniciar Sesión</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --kiroo-red: #d32f2f;
            --bg-dark: #0a0a0a;
            --bg-card: #1a1a1a;
            --text-light: #ffffff;
            --text-muted: #b0b0b0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(ellipse at top, rgba(211, 47, 47, 0.08) 0%, transparent 60%),
                        var(--bg-dark);
        }

        .login-wrapper {
            width: 100%;
            max-width: 900px;
            padding: 2rem;
        }

        .back-home {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--kiroo-red);
            text-decoration: none;
            font-weight: 500;
            margin-bottom: 2rem;
            transition: opacity 0.2s;
        }

        .back-home:hover {
            opacity: 0.8;
            color: var(--kiroo-red);
        }

        .login-header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .login-header .logo {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: 3px;
            margin-bottom: 0.5rem;
        }

        .login-header .logo span {
            color: var(--kiroo-red);
        }

        .login-header h5 {
            color: var(--text-muted);
            font-weight: 400;
        }

        /* Tabs estilo selector de cuenta */
        .account-tabs {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 0.5rem;
        }

        .account-tab {
            background: transparent;
            border: none;
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-muted);
            border-radius: 40px;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .account-tab i {
            margin-right: 8px;
        }

        .account-tab.active {
            background: rgba(211, 47, 47, 0.15);
            color: var(--kiroo-red);
        }

        .account-tab:not(.active):hover {
            background: rgba(255, 255, 255, 0.05);
            color: white;
        }

        /* Tarjeta de login */
        .login-card {
            background: var(--bg-card);
            border-radius: 30px;
            padding: 2rem 2rem;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            max-width: 480px;
            margin: 0 auto;
        }

        .form-control {
            background: #2a2a2a;
            border: 1px solid #3a3a3a;
            color: #fff;
            border-radius: 12px;
            padding: 14px 16px;
        }

        .form-control:focus {
            background: #333;
            border-color: var(--kiroo-red);
            box-shadow: 0 0 0 0.2rem rgba(211, 47, 47, 0.15);
            color: #fff;
        }

        .btn-login {
            background: linear-gradient(135deg, var(--kiroo-red), #b71c1c);
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 14px;
            font-weight: 600;
            width: 100%;
            margin-top: 1rem;
            transition: all 0.3s;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(211, 47, 47, 0.3);
        }

        .error-message {
            background: rgba(244, 67, 54, 0.15);
            border: 1px solid rgba(244, 67, 54, 0.3);
            color: #ef5350;
            padding: 10px 15px;
            border-radius: 10px;
            font-size: 0.85rem;
            margin-bottom: 1rem;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .warning-message {
            background: rgba(255, 152, 0, 0.15);
            border: 1px solid rgba(255, 152, 0, 0.3);
            color: #ffa726;
            padding: 10px 15px;
            border-radius: 10px;
            font-size: 0.85rem;
            margin-bottom: 1rem;
            display: none;
        }

        .warning-message.show {
            display: block;
        }

        .register-link {
            text-align: center;
            margin-top: 2rem;
            color: var(--text-muted);
        }

        .register-link a {
            color: var(--kiroo-red);
            font-weight: 600;
            text-decoration: none;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        .account-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(211, 47, 47, 0.1);
            border-radius: 40px;
            padding: 6px 16px;
            font-size: 0.8rem;
            margin-top: 1rem;
        }

        @media (max-width: 576px) {
            .login-wrapper {
                padding: 1rem;
            }
            .login-card {
                padding: 1.5rem;
            }
            .account-tab {
                padding: 8px 18px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>

<div class="login-wrapper">
    <a href="inicio.html" class="back-home">
        <i class="fa-solid fa-arrow-left"></i> Volver al inicio
    </a>

    <div class="login-header">
        <div class="logo">KI<span>R</span>OO</div>
        <h5>Tu copiloto de confianza</h5>
    </div>

    <!-- Selector de tipo de cuenta estilo pestañas -->
    <div class="account-tabs">
        <button class="account-tab active" data-type="cliente">
            <i class="fa-solid fa-user"></i> Cliente
        </button>
        <button class="account-tab" data-type="mecanico">
            <i class="fa-solid fa-wrench"></i> Mecánico
        </button>
    </div>

    <div class="login-card">
        <div class="text-center mb-3">
            <i class="fa-solid fa-car fa-2x" style="color: var(--kiroo-red);"></i>
            <h4 class="mt-2" id="formTitle">Iniciar Sesión como Cliente</h4>
        </div>

        <div class="error-message" id="errorMessage">
            <i class="fa-solid fa-circle-exclamation me-2"></i>
            <span id="errorText"></span>
        </div>

        <div class="warning-message" id="warningMessage">
            <i class="fa-solid fa-triangle-exclamation me-2"></i>
            <span id="warningText"></span>
        </div>

        <form id="loginForm">
            <div class="mb-3">
                <input type="text" class="form-control" id="username" placeholder="Usuario o Email" required>
            </div>
            <div class="mb-3">
                <input type="password" class="form-control" id="password" placeholder="Contraseña" required>
            </div>
            <button type="submit" class="btn-login">
                <i class="fa-solid fa-right-to-bracket me-2"></i> Ingresar
            </button>
        </form>

        <div class="account-badge mx-auto" style="width: fit-content;" id="accountHint">
            <i class="fa-regular fa-building"></i> <span id="badgeText">Acceso clientes: citas, historial, diagnósticos</span>
        </div>

        <div class="register-link">
            ¿No tienes cuenta?
            <a href="#" id="registerClientLink">Regístrate como Cliente</a> |
            <a href="#" id="registerMechanicLink">Regístrate como Mecánico</a>
        </div>
    </div>
</div>

<script>
    // ====================== ESTADO DE LA APLICACIÓN ======================
    let currentUserType = 'cliente'; // 'cliente' o 'mecanico'

    // Elementos del DOM
    const errorDiv = document.getElementById('errorMessage');
    const errorText = document.getElementById('errorText');
    const warningDiv = document.getElementById('warningMessage');
    const warningText = document.getElementById('warningText');
    const loginForm = document.getElementById('loginForm');
    const formTitle = document.getElementById('formTitle');
    const badgeTextSpan = document.getElementById('badgeText');
    const registerClientLink = document.getElementById('registerClientLink');
    const registerMechanicLink = document.getElementById('registerMechanicLink');
    const tabs = document.querySelectorAll('.account-tab');

    // Funciones UI
    function showError(msg) {
        errorText.textContent = msg;
        errorDiv.classList.add('show');
        warningDiv.classList.remove('show');
    }

    function showWarning(msg) {
        warningText.textContent = msg;
        warningDiv.classList.add('show');
        errorDiv.classList.remove('show');
    }

    function hideMessages() {
        errorDiv.classList.remove('show');
        warningDiv.classList.remove('show');
    }

    // Actualizar la interfaz según el tipo de cuenta seleccionado (cliente/mecánico)
    function updateUIForUserType() {
        if (currentUserType === 'cliente') {
            formTitle.innerHTML = 'Iniciar Sesión como Cliente';
            badgeTextSpan.innerHTML = '🔧 Acceso clientes: citas, historial, diagnósticos, talleres';
            registerClientLink.style.fontWeight = 'bold';
            registerMechanicLink.style.fontWeight = 'normal';
        } else {
            formTitle.innerHTML = 'Iniciar Sesión como Mecánico';
            badgeTextSpan.innerHTML = '⚙️ Acceso mecánicos: gestión de citas, diagnósticos, clientes asignados';
            registerClientLink.style.fontWeight = 'normal';
            registerMechanicLink.style.fontWeight = 'bold';
        }

        // Actualizar clase activa en tabs
        tabs.forEach(tab => {
            const tabType = tab.getAttribute('data-type');
            if (tabType === currentUserType) {
                tab.classList.add('active');
            } else {
                tab.classList.remove('active');
            }
        });
    }

    // Función que ejecuta el login llamando a auth.php
    async function performLogin(username, password, userType) {
        // Creamos FormData y enviamos acción 'login' junto con el username, password y user_type
        const formData = new FormData();
        formData.append('action', 'login');
        formData.append('username', username);
        formData.append('password', password);
        formData.append('user_type', userType);

        try {
            const response = await fetch('auth.php', {
                method: 'POST',
                body: formData
            });

            const result = await response.json();

            if (result.success) {
                // Redirigir según lo que devuelva el backend
                if (result.redirect) {
                    window.location.href = result.redirect;
                } else {
                    // fallback inteligente: según userType redirigir a los nuevos index
                    if (currentUserType === 'cliente') {
                        window.location.href = 'index_cliente.html';
                    } else {
                        window.location.href = 'index_mecanico.html';
                    }
                }
            } else {
                // Verificar si es un error de tipo de cuenta
                if (result.message && result.message.includes('Tu cuenta es de tipo')) {
                    showWarning(result.message);
                    
                    // Cambiar automáticamente a la pestaña correcta
                    if (result.message.includes('Mecánico')) {
                        if (currentUserType !== 'mecanico') {
                            currentUserType = 'mecanico';
                            updateUIForUserType();
                        }
                    } else if (result.message.includes('Cliente')) {
                        if (currentUserType !== 'cliente') {
                            currentUserType = 'cliente';
                            updateUIForUserType();
                        }
                    }
                } else {
                    showError(result.message || 'Credenciales incorrectas. Verifica tus datos.');
                }
            }
        } catch (error) {
            console.error('Error de conexión:', error);
            showError('Error de conexión con el servidor. Intenta nuevamente más tarde.');
        }
    }

    // Evento submit del formulario
    loginForm.addEventListener('submit', async function(e) {
        e.preventDefault();
        hideMessages();

        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;

        if (!username || !password) {
            showError('Por favor completa todos los campos (usuario y contraseña).');
            return;
        }

        const submitBtn = this.querySelector('button[type="submit"]');
        const originalText = submitBtn.innerHTML;
        submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-2"></i>Ingresando...';
        submitBtn.disabled = true;

        await performLogin(username, password, currentUserType);

        submitBtn.innerHTML = originalText;
        submitBtn.disabled = false;
    });

    // Cambio entre pestañas: cliente / mecánico
    tabs.forEach(tab => {
        tab.addEventListener('click', function() {
            const selectedType = this.getAttribute('data-type');
            if (selectedType === currentUserType) return;
            currentUserType = selectedType;
            // Limpiar mensajes al cambiar de rol
            hideMessages();
            // Limpiar campos para mejorar UX
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
            updateUIForUserType();
        });
    });

    // Enlaces de registro: redirigen a las páginas de registro correspondientes
    registerClientLink.addEventListener('click', function(e) {
        e.preventDefault();
        window.location.href = 'registro_cliente.html';
    });

    registerMechanicLink.addEventListener('click', function(e) {
        e.preventDefault();
        window.location.href = 'registro_mecanico.html';
    });

    // Inicializar UI con tipo por defecto: cliente
    updateUIForUserType();

    // Permitir iniciar sesión con Enter en cualquier campo
    document.getElementById('username').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            document.getElementById('password').focus();
        }
    });

    document.getElementById('password').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            loginForm.dispatchEvent(new Event('submit'));
        }
    });
</script>

</body>
</html>
