<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiroo - Login Mecánico</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --kiroo-red: #d32f2f;
            --bg-dark: #0a0a0a;
            --bg-card: #1a1a1a;
            --text-light: #ffffff;
            --text-muted: #b0b0b0;
            --mech-orange: #ff9800;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .login-container {
            width: 100%;
            max-width: 480px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--kiroo-red);
            text-decoration: none;
            font-weight: 500;
            margin-bottom: 1.5rem;
            transition: opacity 0.2s;
        }

        .back-link:hover { opacity: 0.8; color: var(--kiroo-red); }

        .login-card {
            background: var(--bg-card);
            border-radius: 30px;
            padding: 3rem 2.5rem;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-header .icon {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(255, 152, 0, 0.15);
            color: var(--mech-orange);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            margin: 0 auto 1rem;
        }

        .login-header h2 {
            font-weight: 700;
            margin-bottom: 0.3rem;
        }

        .login-header p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .login-header .badge-mechanic {
            background: rgba(255, 152, 0, 0.2);
            color: #ffb74d;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.75rem;
            display: inline-block;
            margin-top: 8px;
        }

        .form-label {
            color: #ccc;
            font-weight: 500;
            font-size: 0.85rem;
            margin-bottom: 6px;
        }

        .input-group-custom {
            position: relative;
            margin-bottom: 1.2rem;
        }

        .input-group-custom i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #666;
            font-size: 1rem;
            z-index: 2;
        }

        .form-control {
            background: #2a2a2a;
            border: 1px solid #3a3a3a;
            color: #fff;
            border-radius: 12px;
            padding: 14px 16px 14px 45px;
            font-size: 0.95rem;
            transition: all 0.2s;
        }

        .form-control:focus {
            background: #333;
            border-color: var(--mech-orange);
            box-shadow: 0 0 0 0.2rem rgba(255, 152, 0, 0.15);
            color: #fff;
        }

        .form-control::placeholder { color: #666; }

        .btn-login {
            background: linear-gradient(135deg, #ff9800, #f57c00);
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 14px;
            font-weight: 600;
            font-size: 1.05rem;
            width: 100%;
            margin-top: 0.5rem;
            transition: all 0.3s;
        }

        .btn-login:hover {
            background: linear-gradient(135deg, #f57c00, #ef6c00);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(255, 152, 0, 0.3);
        }

        .register-link {
            text-align: center;
            margin-top: 1.5rem;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .register-link a {
            color: var(--mech-orange);
            font-weight: 600;
            text-decoration: none;
        }

        .register-link a:hover { text-decoration: underline; }

        .error-message {
            background: rgba(244, 67, 54, 0.15);
            border: 1px solid rgba(244, 67, 54, 0.3);
            color: #ef5350;
            padding: 10px 15px;
            border-radius: 10px;
            font-size: 0.85rem;
            margin-bottom: 1rem;
            display: none;
        }

        .error-message.show { display: block; }
    </style>
</head>
<body>

    <div class="login-container">
        <a href="login.html" class="back-link">
            <i class="fa-solid fa-arrow-left"></i> Cambiar tipo de cuenta
        </a>

        <div class="login-card">
            <div class="login-header">
                <div class="icon">
                    <i class="fa-solid fa-wrench"></i>
                </div>
                <h2>Iniciar Sesión</h2>
                <p>Accede a tu cuenta de mecánico</p>
                <span class="badge-mechanic">
                    <i class="fa-solid fa-gear me-1"></i>Mecánico
                </span>
            </div>

            <div class="error-message" id="errorMessage">
                <i class="fa-solid fa-circle-exclamation me-2"></i>
                <span id="errorText"></span>
            </div>

            <form id="mechanicLoginForm">
                <div class="input-group-custom">
                    <i class="fa-regular fa-envelope"></i>
                    <input type="email" class="form-control" id="email" placeholder="Correo electrónico" required>
                </div>

                <div class="input-group-custom">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" class="form-control" id="password" placeholder="Contraseña" required>
                </div>

                <button type="submit" class="btn-login">
                    <i class="fa-solid fa-right-to-bracket me-2"></i> Ingresar como Mecánico
                </button>
            </form>

            <div class="register-link">
                ¿No tienes cuenta? <a href="registro_mecanico.html">Regístrate aquí</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const errorDiv = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorText');

        function showError(msg) {
            errorText.textContent = msg;
            errorDiv.classList.add('show');
        }

        function hideError() {
            errorDiv.classList.remove('show');
        }

        document.getElementById('mechanicLoginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            hideError();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!email || !password) {
                showError('Por favor completa todos los campos.');
                return;
            }

            // Buscar usuario en localStorage
            const users = JSON.parse(localStorage.getItem('kiroo_users') || '[]');
            const user = users.find(u => u.type === 'mecanico' && u.email === email && u.password === password);

            if (!user) {
                showError('Correo o contraseña incorrectos. Verifica tus datos.');
                return;
            }

            // Establecer sesión activa
            localStorage.setItem('kiroo_currentUser', JSON.stringify({
                id: user.id,
                type: 'mecanico',
                fullName: user.fullName,
                email: user.email
            }));

            // Redirigir al dashboard
            window.location.href = 'dashboard_mecanico.html';
        });
    </script>
</body>
</html>
